<style>
        /* Grain Overlay */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        /* Electric Cobalt Glow */
        .glow-cobalt {
            box-shadow: 0 0 40px rgba(0, 71, 255, 0.4), inset 0 0 20px rgba(0, 71, 255, 0.2);
            border-color: rgba(0, 71, 255, 0.8);
        }
        
        .text-glow-cobalt {
            text-shadow: 0 0 10px rgba(0, 71, 255, 0.6);
        }

        /* Garment Portal Transition */
        @keyframes apertureSpin {
            0% { transform: rotate(0deg) scale(0.95); opacity: 0; }
            100% { transform: rotate(360deg) scale(1); opacity: 1; }
        }
        
        .aperture-reveal {
            animation: apertureSpin 2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
    </style>

<body class="bg-primary dark:bg-[#050505] text-surface-bright min-h-screen flex flex-col overflow-hidden relative">
<div class="grain-overlay"></div>
<!-- Top Navigation (Hidden in this cinematic state, represented by controls) -->

<!-- Brand -->
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-surface-bright">

<div class="w-px h-4 bg-surface-dim/30"></div>

</div>
<button class="font-label-caps text-label-caps text-surface-bright/70 hover:text-surface-bright border-b border-transparent hover:border-surface-bright transition-all">
                SKIP INTRO
            </button>
</div>

<!-- Category Selection Above Aperture -->
<nav class="absolute top-1/4 w-full flex justify-center gap-12 z-20">
<a class="font-headline-md text-headline-md text-surface-bright/30 hover:text-surface-bright/70 transition-colors" href="#">WOMEN</a>

<a class="font-headline-md text-headline-md text-surface-bright/30 hover:text-surface-bright/70 transition-colors" href="#">WHOLESALE</a>
</nav>
<!-- The Belt Buckle Aperture -->

<!-- Outer Ring - Silver hardware simulation -->
<div class="absolute inset-0 rounded-full border border-surface-dim/20 bg-gradient-to-br from-surface-dim/10 to-transparent"></div>
<!-- Inner Ring - Cobalt Glow Lock -->
<div class="absolute inset-[20px] rounded-full border-[1px] glow-cobalt flex items-center justify-center">
<!-- Central Element - Engraved Motif -->
<div class="w-[300px] h-[300px] rounded-full border border-[rgba(0,71,255,0.3)] bg-black flex items-center justify-center relative overflow-hidden">

<div class="absolute inset-0 flex items-center justify-center opacity-80">
<svg class="w-full h-full text-[#0047ff] animate-pulse" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="40" stroke="currentColor" stroke-dasharray="2 4" stroke-width="0.5"></circle>
<circle cx="50" cy="50" fill="none" r="30" stroke="currentColor" stroke-width="1"></circle>
<path d="M 50 10 L 50 90 M 10 50 L 90 50" stroke="currentColor" stroke-width="0.5"></path>
</svg>
