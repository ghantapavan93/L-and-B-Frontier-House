<style>
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .translate-z-back { transform: translateZ(-200px) scale(0.8) translateX(-40%); opacity: 0.5; filter: blur(4px); }
        .translate-z-front { transform: translateZ(0) scale(1) translateX(0); z-index: 10; }
        .translate-z-right { transform: translateZ(-200px) scale(0.8) translateX(40%); opacity: 0.5; filter: blur(4px); z-index: 1; }
        
        .transition-transform-slow { transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease, filter 0.8s ease; }
        
        /* Ink Black Background with Bone White Text overrides for this specific view */
        body {
            background-color: #1c1b1b; /* Ink Black / on-background */
            color: #fcf9f8; /* Bone White / surface */
            overflow: hidden; /* Prevent scrolling in depth carousel */

            background: linear-gradient(135deg, #e5e2e1 0%, #c9c6c5 50%, #f6f3f2 100%);

<script>
        // Lightweight interaction script for the carousel concept
        function shiftCarousel(direction) {
            // In a full implementation, this would rotate classes or manage state.
            // For this static generation, it provides a visual cue that it's interactive.
            const centerPlane = document.querySelector('.translate-z-front');
            centerPlane.style.transform = 'translateZ(0) scale(0.98)';
            setTimeout(() => {
                centerPlane.style.transform = 'translateZ(0) scale(1)';
            }, 150);
        }
    </script>
