  <text x="400" y="524" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" letter-spacing="5" fill="#8a7961">PENDING</text>
  <line x1="330" y1="552" x2="470" y2="552" stroke="#b8a894" stroke-width="1"/>
