<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_44 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_44" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_44');
  const devicePixelRatio = window.devicePixelRatio || 1;
  (function() {
  const container = document.getElementById('threejs-container-BUCKLE_APERTURE');
  const width = container.clientWidth || window.innerWidth;
  const height = container.clientHeight || window.innerHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
  scene.add(ambientLight);
  const spotLight = new THREE.SpotLight(0xffffff, 2);
  spotLight.position.set(10, 10, 10);
  scene.add(spotLight);

  // The Buckle Group
  const buckleGroup = new THREE.Group();

  // Ring 1: Outer Engraved Silver
  const outerRingGeom = new THREE.TorusGeometry(3, 0.15, 16, 100);
  const silverMat = new THREE.MeshPhongMaterial({ color: 0xa7a6a2, shininess: 100, specular: 0xffffff });
  const outerRing = new THREE.Mesh(outerRingGeom, silverMat);
  buckleGroup.add(outerRing);

  // Ring 2: Tooled Leather Inlay
  const leatherRingGeom = new THREE.TorusGeometry(2.6, 0.2, 16, 100);
  const leatherMat = new THREE.MeshPhongMaterial({ color: 0x5E4033, shininess: 10 });
  const leatherRing = new THREE.Mesh(leatherRingGeom, leatherMat);
  buckleGroup.add(leatherRing);

  // Ring 3: Indigo Denim Ring
  const denimRingGeom = new THREE.TorusGeometry(2.2, 0.1, 16, 100);
  const denimMat = new THREE.MeshPhongMaterial({ color: 0x1B2B45, shininess: 5 });
  const denimRing = new THREE.Mesh(denimRingGeom, denimMat);
  buckleGroup.add(denimRing);

  // Center: L&B Aperture Identity
  const centerGeom = new THREE.CylinderGeometry(1.8, 1.8, 0.1, 64);
  const darkMat = new THREE.MeshPhongMaterial({ color: 0x0a0a0a });
  const center = new THREE.Mesh(centerGeom, darkMat);
  center.rotation.x = Math.PI / 2;
  buckleGroup.add(center);

  scene.add(buckleGroup);
  camera.position.z = 15;

  // Animation logic for states
  let state = 0; // 0: Dormant, 1: Reveal, 2: Separate, 3: Portal
  
  const animate = () => {
    requestAnimationFrame(animate);
    
    // Slow cinematic drift
    buckleGroup.rotation.y += 0.002;
    buckleGroup.rotation.z += 0.001;

    // Simulated Ring Separation (State 5/6)
    if (state === 2) {
      outerRing.position.z = Math.sin(Date.now() * 0.001) * 0.5 + 1;
      leatherRing.position.z = Math.sin(Date.now() * 0.001) * 0.3 + 0.5;
      denimRing.position.z = Math.sin(Date.now() * 0.001) * 0.1 + 0.2;
    }

    renderer.render(scene, camera);
  };
  animate();

  window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  });

  // Simple state trigger for preview
  container.addEventListener('click', () => {
    state = (state + 1) % 4;
  });
})();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_44 -->
</body>
</html>
