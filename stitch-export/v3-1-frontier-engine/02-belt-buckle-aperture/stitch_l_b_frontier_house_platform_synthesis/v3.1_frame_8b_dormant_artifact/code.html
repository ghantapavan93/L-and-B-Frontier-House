<!-- Subtle atmospheric JS interaction (mouse follow highlight) -->
<script>
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            // Very subtle shift of background based on mouse movement for parallax depth
            const bgElement = document.querySelector('[data-alt]');
            if(bgElement) {
                const moveX = (x - 0.5) * 10; // max 5px movement
                const moveY = (y - 0.5) * 10;
                bgElement.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.02)`;
            }
        });
    </script>
