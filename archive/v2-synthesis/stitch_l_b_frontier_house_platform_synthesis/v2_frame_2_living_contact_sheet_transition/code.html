<style>
        .garment-portal-grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.03;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }

        .motion-label {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 4px 12px;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            font-weight: 500;
            z-index: 20;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0,0,0,0.1);
        }

        .editorial-image-container {
            position: relative;
            overflow: hidden;
            background-color: #f0eded;
        }

        .editorial-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.2, 0, 0, 1);
        }

        .editorial-image-container:hover .editorial-image {
            transform: scale(1.05);
        }

        /* Simulated entrance animations for storyboard feel */
        @keyframes enterTop { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes enterBottom { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes enterLeft { from { transform: translateX(-50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes enterRight { from { transform: translateX(50px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes expandCenter { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .anim-top { animation: enterTop 1.5s cubic-bezier(0.2, 0, 0, 1) forwards; opacity: 0; }
        .anim-bottom { animation: enterBottom 1.5s cubic-bezier(0.2, 0, 0, 1) forwards; opacity: 0; animation-delay: 0.2s; }
        .anim-left { animation: enterLeft 1.5s cubic-bezier(0.2, 0, 0, 1) forwards; opacity: 0; animation-delay: 0.1s; }
        .anim-right { animation: enterRight 1.5s cubic-bezier(0.2, 0, 0, 1) forwards; opacity: 0; animation-delay: 0.3s; }
        .anim-center { animation: expandCenter 2s cubic-bezier(0.2, 0, 0, 1) forwards; opacity: 0; animation-delay: 0.5s; }

    </style>
