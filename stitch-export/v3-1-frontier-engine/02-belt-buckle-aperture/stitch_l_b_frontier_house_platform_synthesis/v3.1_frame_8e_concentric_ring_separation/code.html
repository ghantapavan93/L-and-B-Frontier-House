<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('main-container');
            
            // Trigger separation animation after a brief delay
            setTimeout(() => {
                container.classList.add('separation-active');
            }, 500);

            // Add subtle mouse parallax effect for depth
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth - 0.5) * 20;
                const y = (e.clientY / window.innerHeight - 0.5) * 20;
                
                const rings = document.querySelectorAll('.portal-ring');
                rings.forEach((ring, index) => {
                    const depth = 6 - index;
                    ring.style.transform = `
                        translateZ(${ring.style.transform.match(/translateZ\((.*?)\)/)?.[1] || '0px'})
                        rotateX(${-y * depth}deg) 
                        rotateY(${x * depth}deg)
                    `;
                });
            });
        });
    </script>
