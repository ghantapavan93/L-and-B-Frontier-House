            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            z-index: 10;
            opacity: 0.3;
            animation: noise 0.2s infinite;
        }
        @keyframes noise {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-5%, -5%); }
            20% { transform: translate(-10%, 5%); }
            30% { transform: translate(5%, -10%); }
            40% { transform: translate(-5%, 15%); }
            50% { transform: translate(-10%, 5%); }
            60% { transform: translate(15%, 0); }

<script>
        // Simple interaction to simulate the "grid expanding to full screen" concept
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('cinemaContainer');
            const hero = document.getElementById('heroVisual');
            
            // Start slightly constrained to simulate the 'grid' origin
            setTimeout(() => {
                container.classList.remove('px-margin-mobile', 'md:px-margin-desktop', 'py-8', 'max-w-container-max-width');
                container.classList.add('px-0', 'py-0', 'max-w-none');
                hero.classList.remove('grayscale-0');
            }, 500);

            // Drag to scroll for film strip
            const slider = document.getElementById('filmStrip');
            let isDown = false;
            let startX;
            let scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                slider.classList.add('active');
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });
            slider.addEventListener('mouseleave', () => {
                isDown = false;
                slider.classList.remove('active');
            });
            slider.addEventListener('mouseup', () => {
                isDown = false;
                slider.classList.remove('active');
            });
            slider.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                const walk = (x - startX) * 2; // Scroll-fast
                slider.scrollLeft = scrollLeft - walk;
            });
        });
    </script>
