<style>
        body {
            background-color: #000; /* Deep rich black base for this specific frame */
            color: #fff;
            overflow-x: hidden;
            overscroll-behavior: none;
        }
        
        .story-container {
            height: 400vh;
            position: relative;
        }
        
        .sticky-section {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cinematic-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease-out, transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), filter 0.8s ease-out;
            transform: scale(1.1);
            filter: grayscale(100%);
        }

        .cinematic-layer.active {
            opacity: 1;
            transform: scale(1);
            filter: grayscale(0%);
            z-index: 10;
        }

        .cinematic-layer.previous {
            opacity: 0.5;
            transform: scale(0.95);
            filter: grayscale(100%);
            z-index: 5;
        }
        
        .cinematic-layer.next {
            opacity: 0;
            transform: scale(1.15);
            z-index: 15;
        }

        .typography-behind {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 15vw;
            line-height: 0.8;
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.1);
            z-index: 2; /* Behind the model */
            mix-blend-mode: overlay;
            font-weight: 700;
        }
        
        .model-front {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 3;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
        }

        .film-strip-overlay {
            position: absolute;
            right: 5%;
            top: 10%;
            width: 25vw;
            height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 20;
            transform: translateY(100px);
            opacity: 0;
            transition: all 1s ease-out;
        }
        
        .film-strip-overlay.visible {
            transform: translateY(0);
            opacity: 1;
        }

        .film-frame {
            height: 30vh;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
        }

        .film-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .film-frame:hover img {
            transform: scale(1.05);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translateX(-50%) translateY(0); }
            50% { opacity: 0.8; transform: translateX(-50%) translateY(10px); }
        }
    </style>
</head>
<body class="antialiased">

<!-- Scene 1: Silhouette & Silver Highlights -->

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('scroll-container');
            const scenes = [
                document.getElementById('scene-1'),
                document.getElementById('scene-2'),
                document.getElementById('scene-3'),
                document.getElementById('scene-4')
            ];
            const filmStrips = document.getElementById('film-strips');
            
            const totalScrollHeight = container.getBoundingClientRect().height - window.innerHeight;

            window.addEventListener('scroll', () => {
                const scrollPos = window.scrollY;
                const scrollProgress = scrollPos / totalScrollHeight;
                
                // Determine active scene (0 to 3)
                let activeIndex = Math.floor(scrollProgress * scenes.length);
                if (activeIndex >= scenes.length) activeIndex = scenes.length - 1;

                scenes.forEach((scene, index) => {
                    scene.classList.remove('active', 'previous', 'next');
                    
                    if (index === activeIndex) {
                        scene.classList.add('active');
                    } else if (index < activeIndex) {
                        scene.classList.add('previous');
                    } else {
                        scene.classList.add('next');
                    }
                });

                // Show film strips near the end
                if (scrollProgress > 0.6) {
                    filmStrips.classList.add('visible');
                } else {
                    filmStrips.classList.remove('visible');
                }
            });
        });
    </script>
