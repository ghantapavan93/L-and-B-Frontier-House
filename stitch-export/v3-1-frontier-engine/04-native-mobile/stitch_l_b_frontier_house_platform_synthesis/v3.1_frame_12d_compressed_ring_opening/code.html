<style>
        /* Mechanical Luxe Ring Animations */
        @keyframes ringExpandCore {
            0% { transform: scale(0.1) rotate(0deg); opacity: 0; }
            30% { transform: scale(1.1) rotate(45deg); opacity: 1; border-width: 12px; }
            100% { transform: scale(3.5) rotate(90deg); opacity: 0; border-width: 1px; }
        }
        
        @keyframes ringExpandMid {
            0% { transform: scale(0.1) rotate(-15deg); opacity: 0; }
            40% { transform: scale(1.0) rotate(15deg); opacity: 1; border-width: 24px; }
            100% { transform: scale(2.8) rotate(45deg); opacity: 0; border-width: 2px; }
        }

        @keyframes ringExpandOuter {
            0% { transform: scale(0.1) rotate(30deg); opacity: 0; }
            50% { transform: scale(0.9) rotate(-10deg); opacity: 1; border-width: 40px; }
            100% { transform: scale(2.2) rotate(-30deg); opacity: 0; border-width: 4px; }
        }

        @keyframes portalReveal {
            0% { clip-path: circle(0% at center); filter: brightness(0) contrast(1.5); }
            40% { clip-path: circle(5% at center); filter: brightness(0.5) contrast(1.2); }
            100% { clip-path: circle(150% at center); filter: brightness(1) contrast(1); }
        }

        @keyframes imagePlaneFloat {
            0% { transform: translateZ(-500px) translateY(100px) rotateX(20deg); opacity: 0; }
            100% { transform: translateZ(0) translateY(0) rotateX(0); opacity: 1; }
        }

        @keyframes navDestinationsReveal {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .ring-core { animation: ringExpandCore 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .ring-mid { animation: ringExpandMid 2.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards; }
        .ring-outer { animation: ringExpandOuter 2.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards; }
        
        .portal-content { animation: portalReveal 2s cubic-bezier(0.7, 0, 0.3, 1) 0.4s forwards; clip-path: circle(0% at center); }
        
        .image-plane { animation: imagePlaneFloat 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards; opacity: 0; }
        
        .nav-item-reveal { animation: navDestinationsReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .nav-delay-1 { animation-delay: 1.6s; }
        .nav-delay-2 { animation-delay: 1.7s; }
        .nav-delay-3 { animation-delay: 1.8s; }
        .nav-delay-4 { animation-delay: 1.9s; }
        .nav-delay-5 { animation-delay: 2.0s; }

        /* Depth and Texture */
        .metal-texture {
            background: linear-gradient(135deg, #e5e2e1 0%, #a09d9c 50%, #e5e2e1 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 30px rgba(255,255,255,0.2);
        }
        
        .leather-texture {
            background: #1c1b1b;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.08"/></svg>');
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }
        
        .light-ring {
            box-shadow: 0 0 50px #ffffff, inset 0 0 30px rgba(255,255,255,0.8);
        }

        .perspective-container {
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
    </style>

<body class="text-on-surface antialiased bg-primary h-screen w-screen flex flex-col items-center justify-center relative">

<script>
        // Micro-interaction for the navigation items to simulate the mechanical luxe feel post-reveal
        document.addEventListener("DOMContentLoaded", () => {
            const navButtons = document.querySelectorAll('nav button');
            
            navButtons.forEach(btn => {
                btn.addEventListener('touchstart', () => {
                    // Slight haptic feedback simulation via CSS class toggle if needed, 
                    // though Tailwind active states handle the scale transform cleanly.
                }, {passive: true});
            });
        });
