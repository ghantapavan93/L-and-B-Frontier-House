<!DOCTYPE html>

<style>
        .garment-portal-overlay {
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
            opacity: 0.05;
            pointer-events: none;
        }
        .silver-gradient {
            background: linear-gradient(135deg, #f5f5f5 0%, #dcdcdc 50%, #b3b3b3 100%);
        }
        .text-shadow-elegant {
            text-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
    </style>

<body class="bg-primary text-on-primary font-body-md min-h-screen overflow-hidden selection:bg-surface-variant selection:text-primary">
<!-- Experience Selector (Top Center) -->
<div class="fixed top-8 left-1/2 -translate-x-1/2 z-[60] flex items-center gap-1 bg-surface-container-highest/20 backdrop-blur-md p-1 rounded-full border border-outline-variant/30">
<button class="px-6 py-2 rounded-full bg-primary text-on-primary font-label-caps text-label-caps flex items-center gap-2 transition-all">
<span class="w-2 h-2 rounded-full silver-gradient shadow-inner"></span>
            Cinema
        </button>
<button class="px-6 py-2 rounded-full text-on-primary/70 hover:text-on-primary font-label-caps text-label-caps transition-all">
            Balanced
        </button>
<button class="px-6 py-2 rounded-full text-on-primary/70 hover:text-on-primary font-label-caps text-label-caps transition-all">
            Instant
        </button>
</div>
<!-- Cinematic Canvas -->
<main class="relative w-full h-screen flex flex-col justify-end pb-margin-desktop overflow-hidden">
<!-- Background Image & Texture -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center bg-no-repeat object-cover transform scale-105 transition-transform duration-[20s] ease-out hover:scale-110" data-alt="A striking, high-fashion editorial portrait of a model wearing a heavy, premium denim jacket with prominent oxidized silver buckles and details. The lighting is cinematic, casting deep, dramatic shadows against a near-black, sophisticated background. The aesthetic blends rugged Western heritage with sleek, modern minimalism, featuring rich textures of leather and denim under studio lighting. The mood is confident, grounded, and intensely luxurious." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBJvkptm5tSseSQSMVIdO1GdaoeE8lVCDsA8y4y5ew0J8x6Ln9jAUdDWEKf1zr3LFKxtnLEG576oX3kTQTZZrd-1wTDPOhQYHedQRECR8GSgo6XjZ6Cz0S653qr0P8Sh_YjtcHu5NRZyJxwDIntPUt7NYDeKmXVkm812BMwL04iGeVcsQ5OI2c8p55tuT_ZYOG3lyy0ULHIEsI7zvtddPjJWsVudnRgIB6_FOzFJpPTPvCLEyg5kPtMMQ')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary via-primary/50 to-transparent"></div>
<div class="absolute inset-0 garment-portal-overlay"></div>
</div>
<!-- Typography Integration -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
<!-- Simulated depth effect: some text behind, some in front -->
<h1 class="font-display-lg text-display-lg text-on-primary text-center max-w-5xl tracking-tighter leading-none opacity-90 mix-blend-overlay">
                NOT THE WEST
            </h1>
<h1 class="font-display-lg text-display-lg text-on-primary text-center max-w-5xl tracking-tighter leading-none text-shadow-elegant mt-2">
                YOU REMEMBER.
            </h1>
</div>
<!-- Actions (Bottom) -->
<div class="relative z-20 flex flex-col items-center gap-6 mt-auto px-margin-mobile md:px-margin-desktop">
<div class="flex flex-col sm:flex-row items-center gap-4">
<button class="group relative px-8 py-4 bg-surface text-primary font-button-text text-button-text overflow-hidden rounded-sm min-w-[200px] flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors duration-300">
<span class="material-symbols-outlined text-lg group-hover:scale-110 transition-transform">explore</span>
<span>ENTER THE FRONTIER</span>
</button>
<button class="px-8 py-4 text-on-primary font-button-text text-button-text border border-outline-variant/30 hover:border-surface hover:bg-surface/10 rounded-sm min-w-[200px] transition-all duration-300 backdrop-blur-sm">
                    SKIP TO SHOP
                </button>
</div>
<p class="font-label-caps text-label-caps text-on-primary/60 tracking-widest mt-8">
                SCROLL TO EXPLORE
            </p>
<div class="w-[1px] h-12 bg-gradient-to-b from-on-primary/50 to-transparent"></div>
</div>
</main>
