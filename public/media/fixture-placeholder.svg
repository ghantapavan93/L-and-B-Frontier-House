<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-hidden="true" focusable="false" preserveAspectRatio="xMidYMid slice">
  <title>Development fixture placeholder</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe9e1"/>
      <stop offset="55%" stop-color="#e6ded3"/>
      <stop offset="100%" stop-color="#ddd3c5"/>
    </linearGradient>
    <pattern id="weave" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 0h16v16H0z" fill="none"/>
      <path d="M0 8h16M8 0v16" stroke="#c9bdac" stroke-opacity="0.35" stroke-width="0.6"/>
