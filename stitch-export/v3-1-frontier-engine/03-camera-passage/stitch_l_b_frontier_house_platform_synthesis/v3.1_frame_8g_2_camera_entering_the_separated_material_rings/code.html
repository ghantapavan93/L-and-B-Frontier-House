<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        /* Portal Animation Styles */
        .portal-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            border-radius: 50%;
            opacity: 0;
            animation: ringExpand 8s infinite cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
        }

        .portal-ring-1 {
            width: 200vw;
            height: 200vw;
            border: 40px solid rgba(196, 199, 199, 0.8); /* Silver / Outline Variant */
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5), 0 0 150px rgba(196, 199, 199, 0.4);
            animation-delay: 0s;
            z-index: 30;
        }
        
        .portal-ring-2 {
            width: 150vw;
            height: 150vw;
            border: 60px solid rgba(28, 27, 27, 0.9); /* Leather / Primary Container */
            box-shadow: inset 0 0 120px rgba(0,0,0,0.8), 0 0 80px rgba(0,0,0,0.6);
            animation-delay: 1.5s;
            z-index: 20;
        }

        .portal-ring-3 {
            width: 100vw;
            height: 100vw;
            border: 30px solid rgba(10, 28, 53, 0.7); /* Denim / Tertiary Container */
            box-shadow: inset 0 0 80px rgba(10, 28, 53, 0.9);
            animation-delay: 3s;
            z-index: 10;
        }

        @keyframes ringExpand {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
        }

        .depth-overlay {
            background: radial-gradient(circle at center, transparent 10%, rgba(0,0,0,0.8) 80%);
            pointer-events: none;
        }
        
        /* Subtle texture for leather/denim rings */
        .texture-grain {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            mix-blend-mode: multiply;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden relative">
<!-- Top Navigation (Suppressed - Cinematic sequence) -->
<!-- We are in a highly transitional, linear cinematic state. The global nav shell is suppressed to focus entirely on the canvas. -->
<!-- Main Cinematic Canvas -->
<main class="flex-grow relative w-full h-screen bg-primary overflow-hidden flex items-center justify-center">
<!-- Background: Deep Portal / Warehouse Hint -->
<div class="absolute inset-0 z-0 flex items-center justify-center bg-tertiary">
<!-- Hint of warehouse architecture in the distance -->
<div class="w-1/2 h-1/2 relative opacity-40 transform scale-75 animate-pulse" style="animation-duration: 4s;">
<img class="object-cover w-full h-full opacity-60" data-alt="A very distant, slightly blurred view into a massive, industrial warehouse space. Tall, rhythmic concrete columns disappear into deep shadow. A single, dramatic shaft of soft, dusty white light pierces through from a high unseen window, illuminating floating dust motes. The overall aesthetic is dark, moody, cinematic, and industrial, acting as a deep background portal." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1oqMczSdwwg4xGqIhPCElJ7FBS0Tv1nY34I8_nPuXqIH-vSRTFq8sAog9hXEqGJeCrXBfMBI2afPpNfWV7v7G5m99NByvMmK8iFEtoyCB_bibY1ZL1XTbTJAPky9pdzMMgGJH6vxvQqlliv-mLxuz9ctZJiwDZzaDgjFBm55sGHXXAk8BIzCUmJOMYDRlUoGcDwCSamabKZs-h8vaudNATbjF5KgH-y8F1Tsszz4ph6Irati6O_iidQ"/>
</div>
</div>
<!-- The Aperture Rings (Animated Depth) -->
<div class="absolute inset-0 z-10 overflow-hidden perspective-1000">
<!-- Ring 3: Deep Denim -->
<div class="portal-ring portal-ring-3">
<div class="texture-grain"></div>
</div>
<!-- Ring 2: Heavy Leather -->
<div class="portal-ring portal-ring-2">
<div class="texture-grain opacity-10"></div>
</div>
<!-- Ring 1: Silver Hardware -->
<div class="portal-ring portal-ring-1">
<!-- Silver reflection gradient simulated with CSS -->
<div class="absolute inset-0 rounded-full border-[20px] border-t-white/40 border-b-black/40 mix-blend-overlay"></div>
</div>
</div>
<!-- Vignette / Depth Overlay -->
<div class="absolute inset-0 z-40 depth-overlay"></div>
<!-- Cinematic Loading/Transition Text -->
<div class="absolute bottom-margin-desktop left-1/2 transform -translate-x-1/2 z-50 text-center flex flex-col items-center gap-4">
<div class="h-px w-16 bg-surface-bright/30 mb-2"></div>
<p class="font-label-caps text-label-caps text-surface-bright/70 uppercase tracking-[0.2em] animate-pulse">Entering the Atelier</p>
<p class="font-headline-md text-headline-md text-surface-bright font-bold tracking-tighter opacity-90">The Bespoke Portal</p>
</div>
</main>
<!-- Footer (Suppressed - Cinematic sequence) -->
<script>
        // Minimal interaction logic: Listen for a 'skip' tap to advance the sequence faster
        document.querySelector('main').addEventListener('click', function() {
            // In a real app, this would route to the next frame or destination
            const rings = document.querySelectorAll('.portal-ring');
            rings.forEach(ring => {
                ring.style.animationDuration = '2s'; // Speed up animation on click
            });
            const text = document.querySelector('.absolute.bottom-margin-desktop p:last-child');
            if(text) text.innerText = "Initializing...";
        });
    </script>
