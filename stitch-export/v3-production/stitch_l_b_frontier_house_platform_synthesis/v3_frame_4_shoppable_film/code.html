<!-- Interactive Logic -->
<script>
        function toggleProductPanel(panelId) {
            const panel = document.getElementById(panelId);
            const allPanels = document.querySelectorAll('[id^="panel-"]');
            
            // Close others
            allPanels.forEach(p => {
                if (p.id !== panelId && !p.classList.contains('opacity-0')) {
                    p.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
                    p.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                    p.closest('.group\\/hotspot').style.zIndex = '10';
                }
            });

            // Toggle target
            if (panel.classList.contains('opacity-0')) {
                panel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
                panel.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
                panel.closest('.group\\/hotspot').style.zIndex = '50';
            } else {
                panel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
                panel.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                panel.closest('.group\\/hotspot').style.zIndex = '10';
            }
        }

        // Close panels when clicking outside
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.group\\/hotspot')) {
                const allPanels = document.querySelectorAll('[id^="panel-"]');
                allPanels.forEach(p => {
                    p.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
                    p.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                    p.closest('.group\\/hotspot').style.zIndex = '10';
                });
            }
        });
    </script>
