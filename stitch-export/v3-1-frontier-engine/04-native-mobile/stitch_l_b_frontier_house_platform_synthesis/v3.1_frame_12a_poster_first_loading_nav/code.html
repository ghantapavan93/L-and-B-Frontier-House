<style>
        /* Custom grain overlay */
        .grain-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        /* Silver gradient utility */
        .bg-silver-gradient {
            background: linear-gradient(135deg, #e5e2e1 0%, #c9c6c5 50%, #858383 100%);
        }
        .text-silver-gradient {
            background: linear-gradient(135deg, #e5e2e1 0%, #c9c6c5 50%, #858383 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Subtle pulse for loading */
        @keyframes subtlePulse {
            0% { opacity: 0.8; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(0.98); }
        }
        .animate-subtle-pulse {
            animation: subtlePulse 3s ease-in-out infinite;
        }

        /* Loading spinner line */
        @keyframes spinLine {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-spin-line {
            animation: spinLine 2s ease-in-out infinite;
        }
    </style>
</head>
