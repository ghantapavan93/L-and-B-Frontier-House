<style>
        .parallax-wrapper {
            perspective: 1000px;
            overflow-x: hidden;
            overflow-y: auto;
            height: 100vh;
        }
        .parallax-layer {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }
        .parallax-layer-back {
            transform: translateZ(-1000px) scale(2);
        }
        .parallax-layer-mid {
            transform: translateZ(-500px) scale(1.5);
        }
        .parallax-layer-front {
            transform: translateZ(0);
        }

</div>
<!-- Midground Layer: Structural Rails -->
<div class="parallax-layer parallax-layer-mid w-full h-full flex items-center justify-center pointer-events-none">
<div class="relative w-full max-w-container-max px-margin-desktop">

<div class="border border-tertiary-fixed-dim/20 w-[70vw] h-[70vh] rounded-[2rem] absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 -rotate-2 z-0"></div>
</div>
