<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>L&amp;B Frontier House - The Frontier Engine</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Chivo:wght@400;600&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#474646",
                        "surface-container-high": "#eae7e7",
                        "on-secondary-fixed": "#1c1c1a",
                        "outline-variant": "#c4c7c7",
                        "surface-container-low": "#f6f3f2",
                        "on-primary-container": "#858383",
                        "primary": "#000000",
                        "on-secondary-fixed-variant": "#474744",
                        "surface-container": "#f0eded",
                        "surface-container-highest": "#e5e2e1",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#e2dfdb",
                        "secondary": "#5f5e5b",
                        "on-secondary-container": "#636260",
                        "on-tertiary-container": "#7584a3",
                        "background": "#fcf9f8",
                        "tertiary-fixed-dim": "#b7c7e8",
                        "outline": "#747878",
                        "inverse-surface": "#313030",
                        "on-surface-variant": "#444748",
                        "secondary-fixed": "#e5e2de",
                        "primary-container": "#1c1b1b",
                        "error": "#ba1a1a",
                        "surface": "#fcf9f8",
                        "primary-fixed-dim": "#c9c6c5",
                        "on-surface": "#1c1b1b",
                        "surface-tint": "#5f5e5e",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f3f0ef",
                        "inverse-primary": "#c9c6c5",
                        "on-tertiary-fixed": "#0a1c35",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e5e2e1",
                        "on-tertiary-fixed-variant": "#384763",
                        "tertiary-fixed": "#d6e3ff",
                        "tertiary": "#000000",
                        "surface-bright": "#fcf9f8",
                        "primary-fixed": "#e5e2e1",
                        "on-primary-fixed": "#1c1b1b",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#c8c6c2",
                        "surface-dim": "#dcd9d9",
                        "on-background": "#1c1b1b",
                        "tertiary-container": "#0a1c35"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "margin-desktop": "64px",
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "headline-md": ["Playfair Display"],
                        "display-lg-mobile": ["Playfair Display"],
                        "body-lg": ["Chivo"],
                        "body-md": ["Chivo"],
                        "display-lg": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"],
                        "button-text": ["Chivo"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-xl": ["Playfair Display"]
                    },
                    "fontSize": {
                        "headline-md": ["32px", { "lineHeight": "40px", "fontWeight": "400" }],
                        "display-lg-mobile": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["84px", { "lineHeight": "92px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["40px", { "lineHeight": "48px", "fontWeight": "400" }],
                        "button-text": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "headline-xl": ["60px", { "lineHeight": "68px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .grain-overlay {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        /* Cinematic black space overrides for this specific frame */
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
        }
        .text-inverted {
            color: #ffffff;
        }
        .bg-inverted {
            background-color: #000000;
        }
        .spatial-text {
            text-shadow: 0 4px 24px rgba(255, 255, 255, 0.2);
            mix-blend-mode: exclusion;
        }
    </style>
</head>
<body class="bg-primary text-on-primary min-h-screen overflow-hidden font-body-md relative selection:bg-surface-dim selection:text-primary">
<!-- Grain Overlay -->
<div class="fixed inset-0 z-50 grain-overlay"></div>
<!-- 3D Scene Background -->

<!-- UI Layer -->
<div class="relative z-10 w-full h-screen flex flex-col pointer-events-none">
<!-- Persistent TopNavBar (Adapted for cinematic mode - simplified shell) -->
<header class="w-full px-margin-desktop py-4 flex justify-between items-center pointer-events-auto">
<div class="font-headline-md text-headline-md font-bold tracking-tighter text-on-primary">
                L&amp;B Frontier House
            </div>
<!-- Experience Selector -->
<nav class="flex gap-8 border border-outline-variant/30 rounded-full px-6 py-3 bg-surface/10 backdrop-blur-md">
<a class="font-label-caps text-label-caps text-on-primary font-bold border-b-2 border-on-primary pb-1 transition-all duration-500 scale-95 flex items-center gap-2" href="#">
<span class="w-2 h-2 rounded-full bg-surface-container-highest shadow-[0_0_8px_rgba(255,255,255,0.8)]"></span>
                    Cinema
                </a>
<a class="font-label-caps text-label-caps text-on-primary/60 hover:text-on-primary transition-colors duration-300 font-body-md flex items-center gap-2" href="#">
                    Balanced
                </a>
<a class="font-label-caps text-label-caps text-on-primary/60 hover:text-on-primary transition-colors duration-300 font-body-md flex items-center gap-2" href="#">
                    Instant
                </a>
</nav>
<div class="flex gap-6">
<button class="hover:text-surface-bright transition-colors duration-300">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</button>
<button class="hover:text-surface-bright transition-colors duration-300">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</div>
</header>
<!-- Spatial Overlay Content -->
<main class="flex-1 w-full h-full relative">
<!-- Dimensional Labels (Absolute positioned to imply spatial relation to 3D scene) -->
<!-- Top Left Floating Label -->
<div class="absolute top-[20%] left-[10%] flex flex-col items-start gap-4 pointer-events-auto transform hover:scale-105 transition-transform duration-500">
<span class="font-label-caps text-label-caps text-on-primary/70 tracking-[0.2em]">CATEGORY ORIGIN</span>
<h2 class="font-headline-xl text-headline-xl text-on-primary spatial-text leading-tight w-64">
                    FROM THREAD <br/>TO TRADE
                </h2>
<div class="h-[1px] w-12 bg-on-primary/50 mt-4"></div>
</div>
<!-- Bottom Right Floating Label -->
<div class="absolute bottom-[25%] right-[10%] flex flex-col items-end gap-4 pointer-events-auto transform hover:scale-105 transition-transform duration-500 text-right">
<span class="font-label-caps text-label-caps text-on-primary/70 tracking-[0.2em]">DESTINATION</span>
<h2 class="font-headline-lg text-headline-lg text-on-primary spatial-text leading-tight">
                    FROM WAREHOUSE <br/>TO FRONTIER WORLD
                </h2>
<button class="mt-6 px-8 py-4 bg-on-primary text-primary font-button-text text-button-text flex items-center gap-4 group hover:bg-surface-variant transition-colors duration-300">
<span class="w-3 h-3 rounded-full bg-primary/20 group-hover:bg-primary shadow-inner"></span>
                    ENTER THE ARCHIVE
                </button>
</div>
<!-- Spatial Navigation Indicators (Center) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center pointer-events-auto w-[600px] h-[600px] border border-on-primary/10 rounded-full opacity-50 animate-[spin_60s_linear_infinite]">
<!-- Orbiting Nodes -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center gap-2 group cursor-pointer hover:scale-110 transition-transform">
<div class="w-4 h-4 bg-on-primary rounded-full shadow-[0_0_15px_rgba(255,255,255,0.5)]"></div>
<span class="font-label-caps text-label-caps text-on-primary opacity-0 group-hover:opacity-100 transition-opacity">WOMEN</span>
</div>
<div class="absolute bottom-1/4 right-0 translate-x-1/2 translate-y-1/2 flex flex-col items-center gap-2 group cursor-pointer hover:scale-110 transition-transform">
<div class="w-4 h-4 bg-on-primary/60 rounded-full"></div>
<span class="font-label-caps text-label-caps text-on-primary opacity-0 group-hover:opacity-100 transition-opacity">PLUS</span>
</div>
<div class="absolute bottom-1/4 left-0 -translate-x-1/2 translate-y-1/2 flex flex-col items-center gap-2 group cursor-pointer hover:scale-110 transition-transform">
<div class="w-4 h-4 bg-on-primary/60 rounded-full"></div>
<span class="font-label-caps text-label-caps text-on-primary opacity-0 group-hover:opacity-100 transition-opacity">ACCESSORIES</span>
</div>
</div>
<!-- Loading Floor Indicator -->
<div class="absolute bottom-[10%] left-1/2 transform -translate-x-1/2 flex flex-col items-center gap-2 pointer-events-auto">
<div class="w-[1px] h-16 bg-gradient-to-b from-transparent to-on-primary"></div>
<span class="font-label-caps text-label-caps text-on-primary/50 uppercase tracking-[0.3em]">Central Loading Floor</span>
</div>
</main>
</div>
</body></html>
