<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .bg-cinematic {
            background: radial-gradient(circle at center, rgba(0, 71, 171, 0.15) 0%, rgba(0,0,0,1) 70%);
            background-color: #000;
        }

        /* Garment Portal Transitions */
        .garment-portal-enter {
            opacity: 0;
            transform: scale(0.98) translateY(10px);
            transition: opacity 1.2s cubic-bezier(0.22, 1, 0.36, 1), transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .garment-portal-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Tonal Layers & Textures */
        .texture-grain {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 10;
        }

        /* Silver Reflections */
        .silver-gradient {
            background: linear-gradient(135deg, #f5f5f5 0%, #c8c6c2 50%, #e5e2e1 100%);
            color: #1c1b1b;
        }
        .silver-text {
            background: linear-gradient(135deg, #ffffff 0%, #c8c6c2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Orbital Layout Styles */
        .orbit-container {
            position: relative;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .orbit-item {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            transition: all 0.5s ease;
        }
        
        .orbit-item:nth-child(1) { transform: translate(-50%, -50%) rotate(0deg) translateY(-300px) rotate(0deg); }
        .orbit-item:nth-child(2) { transform: translate(-50%, -50%) rotate(90deg) translateY(-300px) rotate(-90deg); }
        .orbit-item:nth-child(3) { transform: translate(-50%, -50%) rotate(180deg) translateY(-300px) rotate(-180deg); }
        .orbit-item:nth-child(4) { transform: translate(-50%, -50%) rotate(270deg) translateY(-300px) rotate(-270deg); }
        
        /* Aperture Center */
        .aperture-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 480px;
            border-radius: 200px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255,255,255,0.1);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }
        
        .aperture-center:hover {
            transform: translate(-50%, -50%) scale(1.02);
            box-shadow: 0 0 80px rgba(0, 71, 171, 0.3), inset 0 0 30px rgba(255,255,255,0.2);
        }

        .aperture-center::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: inherit;
            pointer-events: none;
        }
    </style>
