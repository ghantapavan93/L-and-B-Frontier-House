<body class="obsidian-bg text-surface-container-lowest antialiased overflow-hidden h-screen flex flex-col relative selection:bg-on-surface selection:text-surface">

<div class="w-full h-full bg-cover bg-center opacity-80 mix-blend-luminosity" data-alt="A striking, hyper-realistic macro photograph of an intricate, silver engraved Western belt buckle known as the 'Frontier Seal'. The buckle sits on heavily textured, dark raw denim. Lighting is cinematic and highly dramatic, casting deep black shadows that contrast sharply with the gleaming, oxidized silver highlights. The aesthetic is extremely premium, high-fashion, and moody, embodying rugged luxury." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAUGJ4Yi7Qa3F3Yzjh7rNmueivJrXt06RM9FR9p3kJ56wVyBrehWKbD5q4NW2czB09M_UOfCIGd1tsAQ-e1vD_arJ6Kc4NAm7XeroSM_49a1iyobLatj3EcuV7B5cMruJan4ONk7VpWbKP4bObSZh2ZheP5u1En6XiONb4no9MSlH-u_UlsH0UeH8feFSlDbWkl1nsP0lrf_X2RB9AoPl7feDTz7A6k1Rc0gANHZssMQ_ZMR_HIMKB__A')"></div>

<div class="absolute inset-0 bg-gradient-to-t from-[#0b0b0b] via-[#0b0b0b]/40 to-transparent"></div>
</div>
<!-- Content overlay -->
<div class="px-margin-mobile z-10 w-full max-w-md mx-auto flex flex-col items-center">

<p class="font-body-md text-body-md text-center opacity-70 mb-10 max-w-[280px]">Experience rugged heritage crafted for the modern era.</p>
<!-- Experience Selector -->
<div class="w-full mb-8 bg-[#1a1a1a]/80 backdrop-blur-md rounded-full p-1 border border-outline-variant/20 flex relative">
<!-- Active background pill -->
<div class="absolute top-1 bottom-1 left-1 w-[calc(33.333%-4px)] bg-surface-container-lowest rounded-full transition-all duration-300 ease-[cubic-bezier(0.23,1,0.32,1)]" id="selector-pill"></div>
<button class="flex-1 py-3 text-center z-10 relative font-label-caps text-label-caps tracking-widest transition-colors duration-300 text-on-surface" onclick="movePill(0)">CINEMA</button>

<button class="flex-1 py-3 text-center z-10 relative font-label-caps text-label-caps tracking-widest transition-colors duration-300 text-surface-container-lowest opacity-60" onclick="movePill(2)">INSTANT</button>

<script>
        function movePill(index) {
            const pill = document.getElementById('selector-pill');
            const buttons = pill.parentElement.querySelectorAll('button');
            
            // Move pill
            pill.style.transform = `translateX(${index * 100}%)`;
            
            // Update text colors
            buttons.forEach((btn, i) => {
                if(i === index) {
                    btn.classList.remove('text-surface-container-lowest', 'opacity-60');
                    btn.classList.add('text-on-surface');
                } else {
                    btn.classList.add('text-surface-container-lowest', 'opacity-60');
                    btn.classList.remove('text-on-surface');
                }
            });
        }
    </script>
