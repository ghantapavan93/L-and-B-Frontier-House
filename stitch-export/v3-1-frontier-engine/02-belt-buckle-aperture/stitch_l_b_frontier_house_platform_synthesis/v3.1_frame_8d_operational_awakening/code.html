<style>
        body {
            background-color: #0d0d0f; /* Cinematic carbon charcoal */
            color: #ffffff;
            margin: 0;
            overflow: hidden;
        }

        /* Subtle grain texture overlay */
        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Central Buckle/Mechanical Awakening Area */
        .awakening-container {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .buckle-core {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Simulating the engraved routes and glowing geometry */
        .glowing-routes {
            position: absolute;
            inset: -50px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: pulse-glow 4s infinite alternate ease-in-out;
        }
        
        .route-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(163, 196, 243, 0.6), transparent);
            height: 1px;
            width: 150%;
            top: 50%;
            left: -25%;
            transform-origin: center;
            opacity: 0;
            animation: draw-line 3s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        .route-line-1 { transform: rotate(30deg); animation-delay: 0.5s; }
        .route-line-2 { transform: rotate(150deg); animation-delay: 1.2s; }
        .route-line-3 { transform: rotate(90deg); width: 120%; left: -10%; animation-delay: 2s; }

        /* Central Identity Lock */
        .identity-lock {
            font-family: 'Playfair Display', serif;
            font-size: 72px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(163, 196, 243, 0.3);
            opacity: 0;
            transform: scale(0.9);
            animation: lock-in 2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation-delay: 3s;
            position: relative;
            z-index: 20;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(163, 196, 243, 0.05) inset, 0 0 10px rgba(163, 196, 243, 0.05); }
            100% { box-shadow: 0 0 40px rgba(163, 196, 243, 0.15) inset, 0 0 40px rgba(163, 196, 243, 0.15); }
        }

        @keyframes draw-line {
            0% { opacity: 0; transform: scaleX(0) rotate(var(--rot)); }
            100% { opacity: 1; transform: scaleX(1) rotate(var(--rot)); }
        }

        @keyframes lock-in {
            0% { opacity: 0; transform: scale(0.9); letter-spacing: 10px; }
            100% { opacity: 1; transform: scale(1); letter-spacing: 2px; }
        }

        /* Geometric background hints (hatch marks, vectors) */
        .background-geometry {
            position: absolute;
            inset: 0;
            z-index: 5;
            opacity: 0.2;
            background-image: 
                linear-gradient(45deg, rgba(255,255,255,0.02) 1px, transparent 1px), 
                linear-gradient(-45deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

    </style>
