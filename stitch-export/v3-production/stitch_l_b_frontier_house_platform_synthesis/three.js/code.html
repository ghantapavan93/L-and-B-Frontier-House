<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_20 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_20" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_20');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const spotLight = new THREE.SpotLight(0xffffff, 2);
spotLight.position.set(5, 5, 5);
spotLight.angle = 0.3;
spotLight.penumbra = 1;
spotLight.decay = 2;
spotLight.distance = 50;
scene.add(spotLight);

// Material: Oxidized Silver / Brushed Steel
const silverMaterial = new THREE.MeshPhongMaterial({
    color: 0xa7a6a2,
    specular: 0xffffff,
    shininess: 80,
    flatShading: false
});

// Geometry: A stylized western "Pearl Snap" button
const group = new THREE.Group();

const baseGeom = new THREE.CylinderGeometry(1, 1, 0.2, 32);
const base = new THREE.Mesh(baseGeom, silverMaterial);
base.rotation.x = Math.PI / 2;
group.add(base);

const pearlGeom = new THREE.SphereGeometry(0.85, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
const pearlMaterial = new THREE.MeshPhongMaterial({
    color: 0xf5f2ee, // Bone White
    specular: 0xffffff,
    shininess: 100
});
const pearl = new THREE.Mesh(pearlGeom, pearlMaterial);
pearl.position.z = 0.1;
pearl.rotation.x = -Math.PI / 2;
group.add(pearl);

scene.add(group);

camera.position.z = 5;

// Animation
const animate = () => {
    requestAnimationFrame(animate);
    
    // Slow cinematic rotation
    group.rotation.y += 0.005;
    group.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;
    
    renderer.render(scene, camera);
};

animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_20 -->
</body>
</html>
